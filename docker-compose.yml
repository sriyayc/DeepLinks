services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env

  oauth:
    build: ./oauth-server
    ports:
      - "9000:9000"

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      # Server-side Svelte loads use the Docker service name; browser requests
      # continue through the backend port published on the workshop machine.
      API_BASE_URL: http://backend:8000
      PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
      - oauth

  attacker-site:
    build: ./attacker-site
    ports:
      - "7000:7000"
