services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env

  oauth:
    build: ./oauth-server
    ports:
      - "9000:9000"

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
      - oauth

  # Task 4 — CSRF attacker site (different origin from shop)
  # Visit http://localhost:7000      for the silent phishing page
  # Visit http://localhost:7000/demo for the transparent workshop demo
  attacker-site:
    build: ./attacker-site
    ports:
      - "7000:7000"