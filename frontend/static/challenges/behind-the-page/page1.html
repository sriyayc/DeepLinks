<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Found it? — Layer8</title>
  <style>* { box-sizing: border-box; }
:root { color-scheme: light; --paper: #f1efe8; --ink: #232622; --muted: #76796f; --rule: #d4d6cb; }
body { margin: 0; min-height: 100svh; background: var(--paper); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.shell { max-width: 1100px; margin: auto; padding: 0 clamp(24px, 6vw, 80px); }
header { display: flex; justify-content: space-between; align-items: center; gap: 20px; min-height: 104px; border-bottom: 1px solid var(--rule); }
.brand { font-size: 20px; font-weight: 850; letter-spacing: -1px; }
.meta, footer, .number { font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .09em; }
.meta { color: var(--muted); text-transform: uppercase; }
main { padding: clamp(64px, 12vh, 132px) 0 clamp(72px, 14vh, 150px); }
.number { display: inline-block; color: #425a38; border-top: 3px solid #425a38; padding-top: 12px; margin-bottom: 28px; }
h1 { font-size: clamp(42px, 7.5vw, 84px); font-weight: 650; letter-spacing: -.055em; line-height: 1.04; margin: 0 0 50px; }
.copy { border-left: 1px solid var(--rule); padding-left: 24px; }
.copy p { font-size: clamp(18px, 2.4vw, 23px); line-height: 1.65; margin: 0 0 8px; }
a, a:visited { color: inherit; text-decoration: none; }
a:focus-visible { outline: 2px solid #425a38; outline-offset: 5px; }
footer { display: flex; justify-content: space-between; gap: 16px; border-top: 1px solid var(--rule); padding: 22px 0; color: var(--muted); }
code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0; overflow-wrap: anywhere; }
.flag { display: inline-block; font-size: clamp(15px, 2.6vw, 23px); padding: 15px 0; }
.back { margin-top: 26px !important; font-size: 14px !important; color: var(--muted); }
@media (max-width: 480px) { header { min-height: 82px; } .meta { font-size: 10px; letter-spacing: 0; } .copy { padding-left: 18px; } footer { flex-wrap: wrap; } }
</style>
</head>
<body>
  <div class="shell">
